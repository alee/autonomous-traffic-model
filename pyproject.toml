[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "autonomous-traffic-model"
version = "0.1.0"
description = "Exploratory autonomous traffic coordination modeling with Python and SUMO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
sumo = [
  "eclipse-sumo==1.28.0",
  "traci==1.28.0",
  "sumolib==1.28.0",
  "sumo-data==1.28.0",
]

[project.scripts]
autonomous-traffic = "autonomous_traffic.cli:main"

[dependency-groups]
dev = ["hatchling==1.27.0", "ruff==0.17.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_traffic"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/scripts", "/tests", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version",
  "/omf-artifacts/implementation/scenarios/coronado-benchmark.json",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
